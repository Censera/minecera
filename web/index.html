<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self';">
<title>Minecera</title>
<style>
@font-face{font-family:'Lilex';font-style:normal;font-display:swap;font-weight:100 700;src:url('https://cdn.jsdelivr.net/fontsource/fonts/lilex:vf@5.3.0/latin-wght-normal.woff2') format('woff2-variations')}@font-face{font-family:'IBM Plex Sans';font-style:normal;font-display:swap;font-weight:100 700;src:url('https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-sans:vf@5.3.0/latin-wght-normal.woff2') format('woff2-variations')}:root{color-scheme:dark;--bg:#07090b;--panel:#101317;--panel2:#151a20;--line:#252b33;--line2:#3a434e;--text:#f2f0e9;--muted:#a8a69f;--dim:#6e7271;--green:#b8e88a;--yellow:#ffd58a;--red:#ff9aa8;--blue:#a6c8ff;--cyan:#92e6dc;--magenta:#d5b3ff;--mono:'Lilex',ui-monospace,SFMono-Regular,Consolas,monospace;--sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px var(--sans);display:flex;justify-content:center}.app{width:min(1500px,100%);height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:14px 18px 16px;gap:10px}.top{display:flex;align-items:center;justify-content:space-between;min-height:34px}.brand{font-family:var(--sans);font-weight:650;letter-spacing:-.01em;color:#f5f2e9}.state{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--sans);font-weight:500}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.up{background:var(--green);box-shadow:0 0 10px #b8e88a66}.dot.warn{background:var(--yellow);box-shadow:0 0 10px #ffd58a44}.dot.down{background:var(--red);box-shadow:0 0 10px #ff9aa844}.metrics{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}.metric{padding:9px 11px;border-right:1px solid var(--line);min-width:0}.metric:last-child{border:0}.label{font:10px var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}.value{font-family:var(--mono);font-weight:550;color:#ece8de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:#050607;border-radius:6px;overflow:hidden}.logbar{height:34px;flex:none;display:flex;align-items:center;padding:0 11px;border-bottom:1px solid var(--line);background:var(--panel);color:var(--muted);font:11px var(--sans);font-weight:500}.logs{min-height:0;flex:1;overflow:auto;padding:8px 11px;font:11px/1.45 var(--mono);font-weight:500;white-space:pre;tab-size:4;scrollbar-width:none;-ms-overflow-style:none}.logs::-webkit-scrollbar{display:none}.logs .line{min-height:1.45em}.logs .info{color:#eceae3}.logs .ok{color:var(--green)}.logs .warn{color:var(--yellow)}.logs .error{color:var(--red);font-weight:600}.empty{color:var(--dim);padding-top:4px}.inputbar{height:44px;flex:none;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;padding:0 11px;gap:9px;position:relative}.prompt{color:var(--green);user-select:none;font-family:var(--mono);font-weight:600}.command{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#f2f0e9;font:12px var(--mono);font-weight:550;caret-color:var(--green)}.command::placeholder{color:var(--dim)}.send{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:4px;padding:5px 9px;font:11px var(--sans);font-weight:500;cursor:pointer}.send:hover{color:var(--text);border-color:#606b77}.send:disabled{opacity:.4;cursor:default}.suggestions{position:absolute;left:31px;right:72px;bottom:42px;display:none;max-height:210px;overflow:hidden;border:1px solid var(--line2);border-radius:5px;background:#0d1014;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:5}.suggestions.visible{display:block}.suggestion{display:flex;align-items:center;gap:10px;padding:6px 9px;font:11px var(--mono);color:var(--muted);cursor:pointer}.suggestion.selected{background:#1a2028;color:var(--text)}.suggestion-prefix{color:var(--cyan)}.suggestion-source{margin-left:auto;color:var(--dim);font:10px var(--sans)}.actions{display:flex;gap:6px}.actions button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:5px 9px;font:11px var(--sans);font-weight:500;cursor:pointer}.actions button:hover{color:var(--text);border-color:var(--line2)}@media(max-width:800px){.app{padding:10px;gap:8px}.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid var(--line)}.logs{font-size:10px}.actions{display:none}.suggestions{left:30px;right:10px}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">minecera</div><div class="state"><span id="dot" class="dot"></span><span id="state">connecting</span></div></header>
<section class="metrics"><div class="metric"><div class="label">Uptime</div><div class="value" id="uptime">--</div></div><div class="metric"><div class="label">CPU</div><div class="value" id="cpu">--</div></div><div class="metric"><div class="label">Memory</div><div class="value" id="memory">--</div></div><div class="metric"><div class="label">Load</div><div class="value" id="load">--</div></div><div class="metric"><div class="label">Disk</div><div class="value" id="disk">--</div></div><div class="metric"><div class="label">Backup</div><div class="value" id="backup">--</div></div></section>
<main class="main"><div class="logbar"><span>server log</span><span style="margin-left:auto" id="event">waiting</span></div><div class="logs" id="logs"><div class="empty">waiting for server output...</div></div><form class="inputbar" id="command-form"><label class="prompt" for="command">›</label><input id="command" name="command" class="command" autocomplete="off" spellcheck="false" placeholder="enter a Minecraft command"><button id="send" class="send" type="submit">send</button><div id="suggestions" class="suggestions" role="listbox" aria-label="Command suggestions"></div></form></main>
<footer class="actions"><button type="button" data-action="save">save</button><button type="button" data-action="restart">restart</button><button type="button" data-action="stop">stop</button><button type="button" data-action="start">start</button><button type="button" data-action="backup">backup</button><span style="flex:1"></span><span id="updated" style="color:var(--dim);align-self:center;font-family:var(--sans)">--</span></footer></div>
<script>
const $=id=>document.getElementById(id),logs=$('logs'),input=$('command'),suggestions=$('suggestions');let stick=true,history=JSON.parse(localStorage.getItem('minecera.command-history')||'[]'),historyIndex=history.length,suggestionIndex=0,currentSuggestions=[];
const COMMANDS=['advancement','attribute','ban','ban-ip','banlist','bossbar','clear','clone','data','datapack','debug','defaultgamemode','deop','difficulty','effect','enchant','execute','fill','forceload','function','gamemode','gamerule','give','help','item','kick','kill','list','locate','me','op','pardon','pardon-ip','particle','playsound','reload','recipe','reload','save-all','save-off','save-on','say','schedule','scoreboard','seed','setblock','setworldspawn','spawnpoint','spectate','spreadplayers','stop','summon','tag','team','teleport','time','title','tp','trigger','version','weather','whitelist','worldborder','xp','geyser','viaversion','viabackwards','spark','guestmode','veinminer'];
logs.addEventListener('scroll',()=>{stick=logs.scrollHeight-logs.scrollTop-logs.clientHeight<24});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderLogs(lines){const atBottom=stick;logs.innerHTML=lines.length?lines.map(x=>{let c='info';if(/error|exception|failed|fatal/i.test(x))c='error';else if(/warn/i.test(x))c='warn';else if(/healthy|started|stopped|saved|done/i.test(x))c='ok';return '<div class="line '+c+'">'+esc(x)+'</div>'}).join(''):'<div class="empty">no log output</div>';if(atBottom)logs.scrollTop=logs.scrollHeight}
function renderStatus(s){$('state').textContent=s.state||'unknown';$('dot').className='dot '+((s.state||'').toLowerCase().includes('running')?'up':(s.state||'').toLowerCase().includes('stop')?'down':'warn');$('uptime').textContent=s.uptime||'--';$('cpu').textContent=s.cpu||'--';$('memory').textContent=s.memory||'--';$('load').textContent=s.load||'--';$('disk').textContent=s.disk||'--';$('backup').textContent=s.lastBackup||((s.backups??'--')+' backups');$('updated').textContent=s.updated||'--';$('event').textContent=s.journalEvent||'live'}
function apply(data){if(data.status)renderStatus(data.status);if(Array.isArray(data.logs))renderLogs(data.logs)}
function getSuggestions(value){const term=value.trimStart().split(/\s+/)[0].toLowerCase();if(!term)return [];const query=term.startsWith('/')?term.slice(1):term;return COMMANDS.filter(c=>c.startsWith(query)).slice(0,8)}
function renderSuggestions(){const value=input.value;currentSuggestions=getSuggestions(value);suggestionIndex=0;if(!currentSuggestions.length){suggestions.classList.remove('visible');suggestions.innerHTML='';return}suggestions.innerHTML=currentSuggestions.map((c,i)=>'<div class="suggestion'+(i===0?' selected':'')+'" role="option" data-index="'+i+'"><span class="suggestion-prefix">'+esc(c.slice(0,Math.max(0,value.trim().replace(/^\//,'').length)))+'</span><span>'+esc(c.slice(Math.max(0,value.trim().replace(/^\//,'').length)))+'</span><span class="suggestion-source">command</span></div>').join('');suggestions.classList.add('visible');suggestions.querySelectorAll('.suggestion').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();input.value=(value.startsWith('/')?'/':'')+el.textContent.replace(/\s+command$/,'');hideSuggestions();input.focus()}))}
function hideSuggestions(){suggestions.classList.remove('visible');currentSuggestions=[]}
function chooseSuggestion(direction){if(!currentSuggestions.length)return false;suggestionIndex=(suggestionIndex+direction+currentSuggestions.length)%currentSuggestions.length;suggestions.querySelectorAll('.suggestion').forEach((el,i)=>el.classList.toggle('selected',i===suggestionIndex));return true}
function acceptSuggestion(){if(!currentSuggestions.length)return false;const prefix=input.value.trimStart().startsWith('/')?'/':'';input.value=prefix+currentSuggestions[suggestionIndex];input.setSelectionRange(input.value.length,input.value.length);hideSuggestions();return true}
async function command(){const value=input.value.trim();if(!value)return;if(history[history.length-1]!==value)history.push(value);history=history.slice(-200);localStorage.setItem('minecera.command-history',JSON.stringify(history));historyIndex=history.length;hideSuggestions();$('send').disabled=true;try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:value})});if(!r.ok)throw new Error(await r.text());input.value='';}catch(e){$('event').textContent='command failed';console.error(e)}finally{$('send').disabled=false;input.focus()}}
$('command-form').addEventListener('submit',e=>{e.preventDefault();command()});input.addEventListener('input',renderSuggestions);input.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();if(!acceptSuggestion())renderSuggestions();return}if(e.key==='ArrowDown'&&currentSuggestions.length){e.preventDefault();chooseSuggestion(1);return}if(e.key==='ArrowUp'&&currentSuggestions.length){e.preventDefault();chooseSuggestion(-1);return}if(e.key==='Escape'&&currentSuggestions.length){e.preventDefault();hideSuggestions();return}if(e.key==='ArrowUp'&&!currentSuggestions.length&&history.length){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||'';renderSuggestions();return}if(e.key==='ArrowDown'&&!currentSuggestions.length&&history.length){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=historyIndex===history.length?'':history[historyIndex];renderSuggestions();return}});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action})});if(!r.ok)throw new Error(await r.text())}catch(e){$('event').textContent='control failed';console.error(e)}finally{b.disabled=false;input.focus()}});
function connect(){const es=new EventSource('/api/events');es.addEventListener('snapshot',e=>{try{apply(JSON.parse(e.data))}catch(err){console.error(err)}});es.onerror=()=>{es.close();$('state').textContent='disconnected';$('dot').className='dot down';setTimeout(connect,2000)}}connect();input.focus();
</script></body></html>
