<title>Minecera</title>
<style>

.status-panel{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--line);background:var(--panel);border-radius:7px;overflow:hidden}.donut-panel{display:grid;place-items:center;padding:18px;border-right:1px solid var(--line);background:#0c0f12}.donut-wrap{position:relative;width:160px;height:160px;display:grid;place-items:center}.donut{width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--green) 0 var(--p1),var(--blue) var(--p1) var(--p2),var(--purple) var(--p2) var(--p3),#242a31 var(--p3) 100%);-webkit-mask:radial-gradient(circle,transparent 0 54%,#000 55%);mask:radial-gradient(circle,transparent 0 54%,#000 55%)}.donut-center{position:absolute;inset:45px;display:grid;place-items:center;text-align:center}.donut-value{font:700 24px var(--mono)}.donut-label{color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.status-content{padding:14px}.status-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.status-title{font-weight:700}.status-note{color:var(--dim);font-size:10px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status-item{padding:10px 11px;border:1px solid var(--line);background:#0d1014;border-radius:5px}.status-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:6px}.status-value{font:600 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-value.up{color:var(--green)}.status-value.warn{color:var(--yellow)}.status-value.down{color:var(--red)}
.chart-panel{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:12px;overflow:hidden}.chart-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:8px}.chart-title{font-weight:700}.chart-value{font:700 18px var(--mono)}.chart-meta{color:var(--dim);font-size:10px}.chart{position:relative;height:170px;display:grid;grid-template-columns:36px 1fr;gap:8px}.axis{display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;color:var(--dim);font:9px var(--mono);text-align:right}.plot{position:relative;display:flex;align-items:end;gap:2px;height:100%;padding:4px 0 20px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.plot:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 24.5%,var(--line) 25%,transparent 25.5%,transparent 49.5%,var(--line) 50%,transparent 50.5%,transparent 74.5%,var(--line) 75%,transparent 75.5%);pointer-events:none}.bar{position:relative;z-index:1;flex:1;min-width:2px;height:var(--h);background:linear-gradient(to top,var(--blue),#6aa6ff88);border-radius:2px 2px 0 0;opacity:.9;transition:height .25s ease,opacity .15s ease}.bar:hover{opacity:1;background:var(--green)}.empty-chart{color:var(--dim);display:grid;place-items:center;width:100%;font:11px var(--mono)}.chart-foot{display:flex;justify-content:space-between;color:var(--dim);font-size:9px;margin-top:5px;padding-left:44px}
.main{height:520px;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);background:#050607;border-radius:7px;overflow:hidden}.logbar{height:38px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px}.log-title{display:flex;align-items:center;gap:8px}.log-state{width:6px;height:6px;border-radius:50%;background:var(--green)}.log-event{margin-left:auto;margin-right:8px;color:var(--dim);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy,.send,.action{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:4px;padding:5px 9px;font:11px var(--sans);font-weight:550;cursor:pointer}.copy:hover,.send:hover,.action:hover{color:var(--text);border-color:#606b77}.copy:disabled,.send:disabled,.action:disabled{opacity:.4;cursor:default}.logs{min-height:0;flex:1;overflow:auto;padding:9px 11px;font:11px/1.5 var(--mono);white-space:pre;tab-size:4;user-select:text;-webkit-user-select:text;cursor:text;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}.logs::-webkit-scrollbar{width:8px}.logs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}.line{min-height:1.5em}.empty{color:var(--dim);user-select:none}.inputbar{height:44px;display:flex;align-items:center;gap:9px;padding:0 11px;border-top:1px solid var(--line);background:var(--panel);position:relative}.prompt{color:var(--green);font-family:var(--mono);font-weight:700;user-select:none}.command{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:12px var(--mono);caret-color:var(--green)}.command::placeholder{color:var(--dim)}.suggestions{position:absolute;left:31px;right:72px;bottom:42px;display:none;max-height:210px;overflow:auto;border:1px solid var(--line2);border-radius:5px;background:#0d1014;box-shadow:0 12px 30px #00000073;z-index:5}.suggestions.visible{display:block}.suggestion{display:flex;padding:6px 9px;color:var(--muted);font:11px var(--mono);cursor:pointer}.suggestion.selected{background:#1a2028;color:var(--text)}.suggestion-source{margin-left:auto;padding-left:16px;color:var(--dim);font:10px var(--sans)}.actions{display:flex;align-items:center;gap:6px;min-width:0}.updated{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}.mc-black{color:#000}.mc-dark-blue{color:#0000aa}.mc-dark-green{color:#00aa00}.mc-dark-aqua{color:#00aaaa}.mc-dark-red{color:#aa0000}.mc-dark-purple{color:#aa00aa}.mc-gold{color:#ffaa00}.mc-gray{color:#aaa}.mc-dark-gray{color:#555}.mc-blue{color:#55f}.mc-green{color:#5f5}.mc-aqua{color:#5ff}.mc-red{color:#f55}.mc-light-purple{color:#f5f}.mc-yellow{color:#ff5}.mc-white{color:#fff}.mc-bold{font-weight:700}.mc-italic{font-style:italic}.mc-underlined{text-decoration:underline}.mc-strike{text-decoration:line-through}
@media(max-width:900px){.status-panel{grid-template-columns:1fr}.donut-panel{border-right:0;border-bottom:1px solid var(--line);padding:16px}.donut-wrap,.donut{width:130px;height:130px}.donut-center{inset:36px}.status-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){body{padding:10px}.status-grid{grid-template-columns:1fr 1fr}.main{height:460px}.plot{gap:1px}.bar{min-width:1px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">minecera</div><div class="state"><span id="dot" class="dot"></span><span id="state">connecting</span></div></header>
<section class="status-panel">
<div class="donut-panel"><div class="donut-wrap"><div class="donut" id="resource-donut" style="--p1:33%;--p2:66%;--p3:82%"></div><div class="donut-center"><div class="donut-value" id="donut-state">--</div><div class="donut-label">server</div></div></div></div>
<div class="status-content"><div class="status-head"><div class="status-title">system status</div><div class="status-note" id="status-note">waiting for telemetry</div></div><div class="status-grid">
<div class="status-item"><div class="status-label">Uptime</div><div class="status-value" id="uptime">--</div></div>
<div class="status-item"><div class="status-label">CPU</div><div class="status-value" id="cpu">--</div></div>
<div class="status-item"><div class="status-label">Memory</div><div class="status-value" id="memory">--</div></div>
<div class="status-item"><div class="status-label">Load</div><div class="status-value" id="load">--</div></div>
<div class="status-item"><div class="status-label">Disk</div><div class="status-value" id="disk">--</div></div>
<div class="status-item"><div class="status-label">Backup</div><div class="status-value" id="backup">--</div></div>
</div></div>
</section>
<section class="chart-panel"><div class="chart-head"><div><div class="chart-title">players online</div><div class="chart-meta" id="chart-meta">no samples yet</div></div><div class="chart-value" id="chart-value">--</div></div><div class="chart"><div class="axis"><span id="axis-top">--</span><span id="axis-mid">--</span><span>0</span></div><div class="plot" id="player-plot" aria-label="Player count history"></div></div><div class="chart-foot"><span id="chart-start">--</span><span id="chart-end">--</span></div></section>
<main class="main">
<div class="logbar"><span class="log-title"><span class="log-state"></span><span>server log</span></span><span class="log-event" id="event">waiting</span><button id="copy-log" class="copy" type="button">copy log</button></div>
<div class="logs" id="logs"><div class="empty">waiting for server output...</div></div>
<form class="inputbar" id="command-form"><label class="prompt" for="command">›</label><input id="command" class="command" autocomplete="off" spellcheck="false" placeholder="enter a Minecraft command"><button id="send" class="send" type="submit">send</button><div id="suggestions" class="suggestions" role="listbox" aria-label="Command suggestions"></div></form>
</main>
<footer class="actions"><button class="action" type="button" data-action="save">save</button><button class="action" type="button" data-action="restart">restart</button><button class="action" type="button" data-action="stop">stop</button><button class="action" type="button" data-action="start">start</button><button class="action" type="button" data-action="backup">backup</button><span id="updated" class="updated">--</span></footer>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),logs=$('logs'),input=$('command'),suggestions=$('suggestions');
let history=[],historyIndex=0,suggestionIndex=0,currentSuggestions=[],lastLogLines=[],stick=true,copyTimer=0;
try{const raw=localStorage.getItem('minecera.command-history'),parsed=raw?JSON.parse(raw):[];if(Array.isArray(parsed))history=parsed.filter(v=>typeof v==='string').slice(-200)}catch(e){console.warn('Failed to load command history:',e)}historyIndex=history.length;
const COMMANDS=['advancement','attribute','ban','ban-ip','banlist','bossbar','clear','clone','data','datapack','debug','defaultgamemode','deop','difficulty','effect','enchant','execute','fill','forceload','function','gamemode','gamerule','give','help','item','kick','kill','list','locate','me','op','pardon','pardon-ip','particle','playsound','recipe','reload','save-all','save-off','save-on','say','schedule','scoreboard','seed','setblock','setworldspawn','spawnpoint','spectate','spreadplayers','stop','summon','tag','team','teleport','time','title','tp','trigger','version','weather','whitelist','worldborder','xp','geyser','viaversion','viabackwards','spark','guestmode','veinminer'];
const SUBCOMMANDS={gamemode:['survival','creative','adventure','spectator'],gamerule:['announceAdvancements','commandBlockOutput','disableElytraMovementCheck','doDaylightCycle','doEntityDrops','doFireTick','doImmediateRespawn','doInsomnia','doMobLoot','doMobSpawning','doPatrolSpawning','doTileDrops','doTraderSpawning','keepInventory','mobGriefing','naturalRegeneration','playersSleepingPercentage','randomTickSpeed','reducedDebugInfo','sendCommandFeedback','showDeathMessages','spawnRadius','spectatorsGenerateChunks','universalAnger'],difficulty:['peaceful','easy','normal','hard'],weather:['clear','rain','thunder'],time:['day','night','noon','midnight','set','add'],whitelist:['on','off','list','add','remove','reload'],save:['on','off'],datapack:['enable','disable','list'],reload:['confirm'],defaultgamemode:['survival','creative','adventure','spectator'],spectate:['<target>'],op:['<player>'],deop:['<player>'],kick:['<player>'],ban:['<player>'],pardon:['<player>'],give:['<player>','<item>'],tp:['<target>','<destination>'],teleport:['<target>','<destination>'],title:['<target>','clear','reset','set','times'],effect:['give','clear'],recipe:['give','take'],data:['get','merge','modify','remove'],attribute:['get','base','modifier','modifiers'],scoreboard:['objectives','players','teams'],team:['add','remove','join','leave','empty','modify'],bossbar:['add','remove','list','set','get'],particle:['block','dust','entity','item'],execute:['align','anchored','as','at','facing','if','in','positioned','rotated','run','store','summon','unless'],fill:['replace','destroy','keep','outline','hollow','filter'],clone:['replace','masked','filtered','force','move','normal'],schedule:['function','clear'],worldborder:['add','set','center','damage','get','warning']};
const COLORS={'0':'mc-black','1':'mc-dark-blue','2':'mc-dark-green','3':'mc-dark-aqua','4':'mc-dark-red','5':'mc-dark-purple','6':'mc-gold','7':'mc-gray','8':'mc-dark-gray','9':'mc-blue','a':'mc-green','b':'mc-aqua','c':'mc-red','d':'mc-light-purple','e':'mc-yellow','f':'mc-white',l:'mc-bold',m:'mc-strike',n:'mc-underlined',o:'mc-italic'};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function minecraft(text){let html='',buf='',styles=[],color='';const flush=()=>{if(!buf)return;const cls=color?[color,...styles]:styles;html+='<span'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+esc(buf)+'</span>';buf=''};for(let i=0;i<text.length;i++){if(text[i]!=='§'||i+1>=text.length){buf+=text[i];continue}const code=text[++i].toLowerCase();if(code==='r'){flush();styles=[];color='';continue}if(code==='x'&&i+12<text.length){let hex='',ok=true;for(let j=0;j<6;j++){if(text[i+1+j*2]!=='§'||!/[0-9a-f]/i.test(text[i+2+j*2])){ok=false;break}hex+=text[i+2+j*2]}if(ok){flush();color='hex-'+hex;i+=12;continue}}if(/[klmno]/.test(code)){flush();if(COLORS[code]&&!styles.includes(COLORS[code]))styles.push(COLORS[code]);continue}if(COLORS[code]){flush();styles=styles.filter(x=>/^mc-(bold|strike|underlined|italic)$/.test(x));color=COLORS[code];continue}buf+='§'+code}flush();return html.replace(/class="([^"]*hex-([0-9a-f]{6})[^"]*)"/gi,(_,all,hex)=>'class="'+all.replace('hex-'+hex,'')+'" style="color:#'+hex+'"')}
function metric(id,value){$(id).textContent=value||'--'}
function percent(value){const n=parseFloat(String(value||'').replace('%',''));return Number.isFinite(n)?Math.max(0,Math.min(100,n)):0}
function memoryPercent(value){const m=String(value||'').match(/([0-9.]+)G/);return m?Math.min(100,(Number(m[1])/16)*100):0}
function diskPercent(value){const m=String(value||'').match(/\((\d+)%\)/);return m?Number(m[1]):0}
function renderStatus(s){const state=String(s.state||'unknown').toLowerCase();$('state').textContent=s.state||'unknown';$('dot').className='dot '+(state==='running'?'up':state==='offline'||state==='stopped'||state==='failed'?'down':'warn');metric('uptime',s.uptime);metric('cpu',s.cpu);metric('memory',s.memory);metric('load',s.load);metric('disk',s.disk);metric('backup',s.lastBackup||((s.backups??'--')+' backups'));$('updated').textContent=s.updated||'--';$('event').textContent=s.journalEvent||'live';$('status-note').textContent=state==='running'?'live telemetry':state==='offline'?'server offline':'server state: '+state;$('donut-state').textContent=state==='running'?'RUN':'DOWN';const cpu=percent(s.cpu),mem=memoryPercent(s.memory),disk=diskPercent(s.disk);$('resource-donut').style.setProperty('--p1',cpu*0.36+'%');$('resource-donut').style.setProperty('--p2',(cpu*0.36+mem*0.36)+'%');$('resource-donut').style.setProperty('--p3',(cpu*0.36+mem*0.36+disk*0.28)+'%');['cpu','memory','disk'].forEach(id=>$(id).className='status-value '+(state==='running'?'up':'down'))}
function sameLogs(next){if(next.length!==lastLogLines.length)return false;for(let i=0;i<next.length;i++)if(next[i]!==lastLogLines[i])return false;return true}
function renderLogs(lines){if(sameLogs(lines))return;lastLogLines=lines.slice();const stickNow=stick;const frag=document.createDocumentFragment();if(!lines.length){const e=document.createElement('div');e.className='empty';e.textContent='no log output';frag.append(e)}else for(const line of lines){const e=document.createElement('div');e.className='line';e.innerHTML=minecraft(line);frag.append(e)}logs.replaceChildren(frag);if(stickNow)logs.scrollTop=logs.scrollHeight}
async function updatePlayerGraph(){try{const r=await fetch('/api/player-count?points=120',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const data=await r.json();renderPlayerGraph(data.points||[])}catch(e){$('chart-meta').textContent='graph unavailable';console.error('Player graph failed:',e)}}
function renderPlayerGraph(points){const plot=$('player-plot');plot.replaceChildren();if(!points.length){const e=document.createElement('div');e.className='empty-chart';e.textContent='no player samples yet';plot.append(e);$('chart-value').textContent='--';$('chart-meta').textContent='waiting for telemetry';$('axis-top').textContent='--';$('axis-mid').textContent='--';$('chart-start').textContent='--';$('chart-end').textContent='--';return}const max=Math.max(1,...points.map(p=>Number(p.count)||0)),latest=points[points.length-1],mid=Math.ceil(max/2);$('axis-top').textContent=max;$('axis-mid').textContent=mid;$('chart-value').textContent=String(latest.count);$('chart-meta').textContent=points.length+' samples';$('chart-start').textContent=new Date(points[0].time*1000).toLocaleString();$('chart-end').textContent=new Date(latest.time*1000).toLocaleString();for(const point of points){const bar=document.createElement('div');const count=Number(point.count)||0;bar.className='bar';bar.style.setProperty('--h',Math.max(1,(count/max)*100)+'%');bar.title=new Date(point.time*1000).toLocaleString()+': '+count+' players';plot.append(bar)}}
function apply(data){if(data.status?.status)renderStatus(data.status.status);else if(data.status)renderStatus(data.status);if(Array.isArray(data.logs))renderLogs(data.logs)}
function completionContext(value){const lead=value.match(/^\s*/)?.[0]||'',raw=value.slice(lead.length),slash=raw.startsWith('/')?'/':'',body=raw.slice(slash.length),trailing=/\s$/.test(body),tokens=body.match(/\S+/g)||[];if(!tokens.length)return{query:'',items:COMMANDS.map(value=>({value,source:'command'})),slash,source:'command',trailing};const command=tokens[0].toLowerCase(),source=SUBCOMMANDS[command];if(source){if(tokens.length===1&&trailing)return{query:'',items:source.map(value=>({value,source:'subcommand'})),slash,source:'subcommand',command,trailing};if(tokens.length>=2){const query=trailing?'':tokens[tokens.length-1].toLowerCase();return{query,items:source.filter(value=>value.toLowerCase().startsWith(query)).map(value=>({value,source:'subcommand'})),slash,source:'subcommand',command,trailing}}}if(tokens.length>1||trailing)return{query:'',items:[],slash,source:'argument',trailing};const query=tokens[0].toLowerCase();return{query,items:COMMANDS.filter(value=>value.startsWith(query)).map(value=>({value,source:'command'})),slash,source:'command',trailing}}
function hideSuggestions(){suggestions.classList.remove('visible');suggestions.replaceChildren();currentSuggestions=[];suggestionIndex=0}
function renderSuggestions(){const ctx=completionContext(input.value);currentSuggestions=ctx.items.slice(0,10);suggestionIndex=0;if(!currentSuggestions.length){hideSuggestions();return}const frag=document.createDocumentFragment();currentSuggestions.forEach((item,i)=>{const row=document.createElement('div');row.className='suggestion'+(i===0?' selected':'');row.dataset.index=i;const word=document.createElement('span');word.textContent=item.value.slice(0,ctx.query.length)+item.value.slice(ctx.query.length);const src=document.createElement('span');src.className='suggestion-source';src.textContent=item.source;row.append(word,src);frag.append(row)});suggestions.replaceChildren(frag);suggestions.classList.add('visible')}
function insertSuggestion(item){const ctx=completionContext(input.value),raw=input.value,lead=raw.match(/^\s*/)?.[0]||'',body=raw.slice(lead.length+ctx.slash.length),parts=body.match(/\S+/g)||[];if(ctx.source==='subcommand'){if(ctx.trailing)parts.push(item.value);else parts[parts.length-1]=item.value}else if(ctx.source==='command')parts[0]=item.value;else return;input.value=lead+ctx.slash+parts.join(' ')+' ';input.setSelectionRange(input.value.length,input.value.length);hideSuggestions()}
function choose(delta){if(!currentSuggestions.length)return;suggestionIndex=(suggestionIndex+delta+currentSuggestions.length)%currentSuggestions.length;suggestions.querySelectorAll('.suggestion').forEach((e,i)=>e.classList.toggle('selected',i===suggestionIndex))}
async function sendCommand(){const value=input.value.trim();if(!value)return;if(history[history.length-1]!==value)history.push(value);history=history.slice(-200);historyIndex=history.length;try{localStorage.setItem('minecera.command-history',JSON.stringify(history))}catch(e){console.warn('Failed to save command history:',e)}hideSuggestions();$('send').disabled=true;try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:value})});if(!r.ok)throw new Error(await r.text());input.value=''}catch(e){$('event').textContent='command failed';console.error('Command failed:',e)}finally{$('send').disabled=false;input.focus()}}
logs.addEventListener('scroll',()=>{stick=logs.scrollHeight-logs.scrollTop-logs.clientHeight<24});$('command-form').addEventListener('submit',e=>{e.preventDefault();sendCommand()});input.addEventListener('input',()=>input.value?renderSuggestions():hideSuggestions());input.addEventListener('keydown',e=>{if(e.key==='Tab'&&currentSuggestions.length){e.preventDefault();insertSuggestion(currentSuggestions[suggestionIndex]);return}if(e.key==='ArrowDown'&&currentSuggestions.length){e.preventDefault();choose(1);return}if(e.key==='ArrowUp'&&currentSuggestions.length){e.preventDefault();choose(-1);return}if(e.key==='Escape'&&currentSuggestions.length){e.preventDefault();hideSuggestions();return}if(e.key==='ArrowUp'&&!currentSuggestions.length&&history.length){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||''}if(e.key==='ArrowDown'&&!currentSuggestions.length&&history.length){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=historyIndex===history.length?'':history[historyIndex]}});suggestions.addEventListener('mousedown',e=>{const row=e.target.closest('.suggestion');if(!row)return;e.preventDefault();insertSuggestion(currentSuggestions[Number(row.dataset.index)]);input.focus()});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',async()=>{button.disabled=true;try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:button.dataset.action})});if(!r.ok)throw new Error(await r.text())}catch(e){$('event').textContent='control failed';console.error('Control failed:',e)}finally{button.disabled=false;input.focus()}}));$('copy-log').addEventListener('click',async()=>{if(!lastLogLines.length)return;const button=$('copy-log');button.disabled=true;try{await navigator.clipboard.writeText(lastLogLines.join('\n'));button.textContent='copied'}catch(e){button.textContent='copy failed';console.error('Copy log failed:',e)}finally{clearTimeout(copyTimer);copyTimer=setTimeout(()=>{button.textContent='copy log';button.disabled=false},1400)}});const events=new EventSource('/api/events');events.addEventListener('snapshot',e=>{try{apply(JSON.parse(e.data))}catch(err){$('event').textContent='invalid snapshot';console.error('Invalid server snapshot:',err)}});events.addEventListener('error',()=>{if(events.readyState===EventSource.CLOSED){$('state').textContent='disconnected';$('dot').className='dot down'}});updatePlayerGraph();setInterval(updatePlayerGraph,5000);input.focus();
</script>
</body>
</html>
