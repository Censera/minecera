config-version: 1
integrated-server-render-distance: -1
global:
  enabled: true
  chunk-generation-limit: 3
  chunk-send-limit: 3
dimensions:
  defaults:
    enabled: true
    chunk-generation-limit: 2
    chunk-queue-size: 16
    view-distance: 12
    cache-duration: PT5M
    anti-xray:
      enabled: false
      engine-mode: HIDE
      hidden-blocks: []
    chunk-batches:
      enabled: true
      chunks-per-batch: 12
      prepare-chunks-while-waiting: true
      batch-timeout: PT5S
      batch-wait-timeout: PT30S
